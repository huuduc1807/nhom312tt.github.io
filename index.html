<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nhóm 4 - Lớp 12TT</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }

        /* 1. Tiêu đề nhóm */
        .header { text-align: center; background-color: #1e3c72; color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }

        /* Khung nội dung chung */
        .box { background-color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ddd; }
        .box h2 { text-align: center; color: #1e3c72; margin-bottom: 15px; border-bottom: 2px solid #1e3c72; padding-bottom: 5px; }

        /* 2. Ảnh nhóm lớn */
        .group-img { width: 50%; height: auto; border-radius: 8px; border: 1px solid #ccc; }

        /* 3. 5 Thành viên */
        .member-container { display: flex; justify-content: space-around; flex-wrap: wrap; text-align: center; }
        .member-item { width: 150px; margin: 10px; }
        .member-item img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 2px solid #1e3c72; }
        .member-item p { font-weight: bold; margin-top: 8px; font-size: 0.95rem; }

        /* 4. Khu vực bài tập chia cục */
        .exercise-item { border-radius: 8px; padding: 15px; margin-bottom: 15px; display: flex; align-items: center; gap: 15px; }
        .exercise-item img { width: 120px; height: 80px; object-fit: cover; border-radius: 5px; border: 1px solid #ccc; }
        .exercise-info h3 { margin-bottom: 5px; }
        .exercise-info a { display: inline-block; margin-top: 8px; color: white; background-color: #333; padding: 5px 12px; text-decoration: none; border-radius: 4px; font-size: 0.85rem; }

        /* Màu nền riêng cho từng cục bài tập */
        .cuc-1 { background-color: #e3f2fd; color: #0d47a1; }
        .cuc-2 { background-color: #e8f5e9; color: #1b5e20; }
        .cuc-3 { background-color: #fff3e0; color: #e65100; }
    </style>
</head>
<body>

    <div class="container">

        <!-- 1. TIÊU ĐỀ NÓM CĂN GIỮA -->
        <div class="header">
            <h1>NHÓM 4 - LỚP 12TT</h1>
        </div>

        <!-- 2. ẢNH NHÓM LỚN -->
        <div class="box">
            <h2>HÌNH ẢNH NHÓM</h2>
            <img src="nhom.jpg" alt="Ảnh Nhóm 4" class="group-img">
        </div>

        <!-- 3. TƯỜNG THÀNH VIÊN THEO TÊN -->
        <div class="box">
            <h2>THÀNH VIÊN NHÓM</h2>
            <div class="member-container">
                <div class="member-item">
                    <img src="nam.jpg" alt="Nguyễn Bảo Nam">
                    <p>Nguyễn Bảo Nam</p>
                </div>
                <div class="member-item">
                    <img src="duc.jpg" alt="Nguyễn Hữu Đức">
                    <p>Nguyễn Hữu Đức</p>
                </div>
<div class="member-item">
                    <img src="nhu.jpg" alt="Mai Thanh Như">
                    <p>Mai Thanh Như</p>
                </div>
                <div class="member-item">
                    <img src="han.jpg" alt="Nguyễn Hoàng Gia Hân">
                    <p>Nguyễn Hoàng Gia Hân</p>
                </div>
                <div class="member-item">
                    <img src="my.jpg" alt="Huỳnh Dương Ái My">
                    <p>Huỳnh Dương Ái My</p>
                </div>
            </div>
        </div>

        <!-- 4. KHU VỰC LƯU BÀI TẬP CHIA CỤC -->
        <div class="box">
            <h2>DANH SÁCH BÀI TẬP</h2>

            <!-- Cục 1 -->
            <div class="exercise-item cuc-1">
                <img src="images/baitap1.jpg" alt="Bài tập 1">
                <div class="exercise-info">
                    <h3>Bài tập 1</h3>
                    <p>Bài tập </p>
                    <a href="baitap1.html">Xem bài tập</a>
                </div>
            </div>

            <!-- Cục 2 -->
            <div class="exercise-item cuc-2">

                <div class="exercise-info">
                    <h3>Bài tập 2</h3>
                    <p>Bài tập </p>
                    <a href="baitap2.html">Xem bài tập</a>
                </div>
            </div>

            <!-- Cục 3 -->
            <div class="exercise-item cuc-3">
                <img src="images/baitap3.jpg" alt="Bài tập 3">
                <div class="exercise-info">
                    <h3>Bài tập </h3>
                    <p>Bài tập </p>
                    <a href="baitap3.html">Xem bài tập</a>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
