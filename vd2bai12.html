<!DOCTYPE html>

<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trang web nghệ thuật</title>

<style>

  /* CSS để định dạng iframe */

  iframe {

    width: 100%;

    height: 500px;

    border: 1px solid #ccc;

  }

</style>

</head>

<body>

<h1>NGHỆ THUẬT</h1>

<!-- Chèn ảnh minh họa -->

<img src="my.jpg" alt="IMAGE" width="500" height="300">

<!-- Chèn bài hát Quốc ca -->

<audio controls>

  <source src="https://mysiteku.me/001/?cfccfd85c8c43314237c0827875cee" type="audio/mpeg">

  Trình duyệt của bạn không hỗ trợ phát audio.

</audio>

<!-- Thêm liên kết "Đăng kí" -->

<p><a href="https://huuduc1807.github.io/nhom312tt.github.io/vd1bai12.html" target="iframe_content">Đăng ký</a></p>

<!-- iframe để hiển thị trang web đã viết ở câu 1 -->

<iframe name="iframe_content" frameborder="0"></iframe>

</body>

</html>
